name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            shell: bash
            ext: ""
          - name: windows
            os: windows-latest
            shell: "msys2 {0}"
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            curl
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc

      - name: Fetch nets
        shell: ${{ matrix.shell }}
        run: make net

      # SUFFIX is pinned rather than left to the Makefile's $(OS) check, which
      # depends on the shell exporting OS=Windows_NT and quietly produces an
      # extension-less binary when it does not.
      - name: Build
        shell: ${{ matrix.shell }}
        run: |
          make -j STRICT_NETS=yes \
            EXE=Prolix-${{ matrix.name }} \
            SUFFIX='${{ matrix.ext }}' \
            ARCH=x86-64-v3 TUNE=generic

      - name: Bench
        shell: ${{ matrix.shell }}
        run: ./Prolix-${{ matrix.name }}${{ matrix.ext }} bench

      - uses: actions/upload-artifact@v4
        with:
          name: Prolix-${{ matrix.name }}
          path: Prolix-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error
